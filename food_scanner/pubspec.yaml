version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'  # Ajusta esto a tu versión de Dart/Flutter

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+5
  image_picker: ^1.0.4
