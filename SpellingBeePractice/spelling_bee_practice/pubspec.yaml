name: spelling_bee_practice
description: "A new Flutter project."

version: 1.0.0+2002

environment:
  sdk: ^3.5.3

dependencies:
  bloc: ^9.0.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_launcher_icons: ^0.14.3
  flutter_tts: ^4.2.2
  path: ^1.9.1
  shared_preferences: ^2.5.2
  sqflite: ^2.4.1
  translator: ^1.0.3+1

dev_dependencies:

  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"  # Puedes usar "true" para usar el nombre por defecto
  ios: true
  image_path: "assets/icon/icon.png"  # Ruta a tu imagen
  min_sdk_android: 21 # Puedes ajustar esto si necesitas un minSdkVersion diferente
  # Opciones adicionales (opcionales):
